<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Summarizer</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .has-mask {
            position: absolute;
            clip: rect(10px, 150px, 130px, 10px);
        }

        .loading-spinner {
            display: none;
        }
    </style>
</head>f

<body>
    <div class="relative min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8 bg-gray-500 bg-no-repeat bg-cover relative items-center"
        style="background-image: url(https://images.unsplash.com/photo-1621243804936-775306a8f2e3?ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80);">
        <div class="absolute bg-black opacity-60 inset-0 z-0"></div>
        <div class="sm:max-w-lg w-full p-10 bg-white rounded-xl z-10">
            <div class="text-center">
                <h2 class="mt-5 text-3xl font-bold text-gray-900">
                    Video Upload!
                </h2>
                <p class="mt-2 text-sm text-gray-400">mp4 video format</p>
            </div>
            <form id="uploadForm" action="/upload" method="post" enctype="multipart/form-data" name="video_upload"
                onsubmit="showLoadingSpinner">
                <div class="grid grid-cols-1 space-y-2">
                    <label class="text-sm font-bold text-gray-500 tracking-wide">Attach Video</label>
                    <div class="flex items-center justify-center w-full">
                        <label
                            class="flex flex-col rounded-lg border-4 border-dashed w-full h-60 p-10 group text-center">
                            <div class="h-full w-full text-center flex flex-col items-center justify-center items-center  ">
                                <input type="file" id="video" name="video" accept="video/*" class="hidden"
                                    onchange="displayFileName(this)" />
                                <div
                                    class="flex flex-auto max-h-48 w-2/5 mx-auto -mt-10">
                                    <img class="has-mask h-36 object-center"
                                        src="https://img.freepik.com/free-vector/image-upload-concept-landing-page_52683-27130.jpg?size=338&ext=jpg"
                                        alt=" image">
                                </div>
                                <p id="file-chosen-message" class="pointer-none text-gray-500"><span
                                        class="text-sm">Drag and drop</span>
                                    files here <br /> or <label for="video"
                                        class="text-blue-600 hover:underline cursor-pointer">select a file</label>
                                    from your computer</p>
                            </div>
                        </label>
                    </div>
                </div>
                <p class="text-sm text-gray-300"><span>File type: .mp4 Video</span></p>
                <div>
                    <input type="submit"
                        class="my-5 w-full flex justify-center bg-blue-500 text-gray-100 p-4  rounded-full tracking-wide
                                font-semibold  focus:outline-none focus:shadow-outline hover:bg-blue-600 shadow-lg cursor-pointer transition ease-in duration-300"
                        value="Upload">
                </div>
                <div id="loading-spinner" class="loading-spinner text-center mt-3">
                    <div class="animate-spin inline-block w-6 h-6 border-t-2 border-blue-500"></div>
                </div>
            </form>
            <iframe id="uploadIframe" name="uploadIframe" class="hidden"></iframe>
        </div>
    </div>

    <script>
        function displayFileName(input) {
            const fileName = input.files[0].name;
            document.getElementById('file-chosen-message').innerHTML = `File chosen: ${fileName}`;
        }

        function showLoadingSpinner() {
            console.log("Hello")
            document.getElementById('loading-spinner').innerHTML= `loading`;
        }
    </script>
</body>

</html>
